<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cruz Brain — Thread Monitor</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        :root {
            --bg-primary: #0a0a0f;
            --bg-secondary: #12121a;
            --bg-card: #1a1a26;
            --bg-card-hover: #22222f;
            --bg-turn-user: #1e1e2e;
            --bg-turn-ai: #151520;
            --border: #2a2a3a;
            --border-active: #4a4aff;
            --text-primary: #e8e8f0;
            --text-secondary: #8888a0;
            --text-muted: #55556a;
            --accent: #6c5ce7;
            --accent-glow: rgba(108, 92, 231, 0.3);
            --green: #00e676;
            --green-glow: rgba(0, 230, 118, 0.25);
            --amber: #ffab40;
            --red: #ff5252;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            min-height: 100vh;
            overflow-x: hidden;
        }

        /* Header */
        .header {
            position: sticky;
            top: 0;
            z-index: 100;
            background: rgba(10, 10, 15, 0.85);
            backdrop-filter: blur(20px);
            border-bottom: 1px solid var(--border);
            padding: 16px 32px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .header-left {
            display: flex;
            align-items: center;
            gap: 14px;
        }

        .header-icon {
            width: 36px;
            height: 36px;
            background: linear-gradient(135deg, var(--accent), #a78bfa);
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
        }

        .header-title {
            font-size: 18px;
            font-weight: 600;
            letter-spacing: -0.3px;
        }

        .header-subtitle {
            font-size: 12px;
            color: var(--text-secondary);
            margin-top: 2px;
        }

        .header-stats {
            display: flex;
            align-items: center;
            gap: 20px;
        }

        .live-badge {
            display: flex;
            align-items: center;
            gap: 6px;
            padding: 6px 14px;
            border-radius: 20px;
            background: rgba(0, 230, 118, 0.08);
            border: 1px solid rgba(0, 230, 118, 0.2);
            font-size: 12px;
            font-weight: 500;
            color: var(--green);
        }

        .live-dot {
            width: 7px;
            height: 7px;
            border-radius: 50%;
            background: var(--green);
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0%, 100% { box-shadow: 0 0 0 0 var(--green-glow); }
            50% { box-shadow: 0 0 0 8px transparent; }
        }

        .stat-item {
            font-size: 13px;
            color: var(--text-secondary);
        }

        .stat-item strong {
            color: var(--text-primary);
            font-weight: 600;
        }

        /* Layout */
        .layout {
            display: grid;
            grid-template-columns: 380px 1fr;
            height: calc(100vh - 69px);
        }

        /* Thread List Sidebar */
        .sidebar {
            border-right: 1px solid var(--border);
            overflow-y: auto;
            padding: 16px;
        }

        .sidebar::-webkit-scrollbar { width: 4px; }
        .sidebar::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }

        .search-box {
            position: relative;
            margin-bottom: 16px;
        }

        .search-box input {
            width: 100%;
            padding: 10px 14px 10px 38px;
            border-radius: 10px;
            border: 1px solid var(--border);
            background: var(--bg-secondary);
            color: var(--text-primary);
            font-size: 13px;
            font-family: inherit;
            outline: none;
            transition: border-color 0.2s;
        }

        .search-box input:focus { border-color: var(--accent); }

        .search-box .search-icon {
            position: absolute;
            left: 12px;
            top: 50%;
            transform: translateY(-50%);
            font-size: 14px;
            color: var(--text-muted);
        }

        .thread-card {
            padding: 14px 16px;
            border-radius: 12px;
            border: 1px solid transparent;
            cursor: pointer;
            transition: all 0.2s ease;
            margin-bottom: 6px;
            position: relative;
        }

        .thread-card:hover {
            background: var(--bg-card);
            border-color: var(--border);
        }

        .thread-card.active {
            background: var(--bg-card);
            border-color: var(--border-active);
            box-shadow: 0 0 0 1px var(--accent-glow);
        }

        .thread-card-header {
            display: flex;
            align-items: flex-start;
            justify-content: space-between;
            gap: 8px;
        }

        .thread-card-title {
            font-size: 14px;
            font-weight: 500;
            line-height: 1.3;
            color: var(--text-primary);
        }

        .thread-card-meta {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-top: 8px;
            font-size: 11px;
            color: var(--text-secondary);
        }

        .thread-card-meta .user-tag {
            padding: 2px 8px;
            border-radius: 6px;
            background: rgba(108, 92, 231, 0.12);
            color: var(--accent);
            font-weight: 500;
        }

        .turn-count {
            padding: 2px 8px;
            border-radius: 6px;
            background: rgba(255, 255, 255, 0.05);
            font-weight: 500;
        }

        .recent-indicator {
            position: absolute;
            top: 14px;
            right: 14px;
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: var(--green);
            animation: pulse 2s infinite;
        }

        /* Detail Panel */
        .detail-panel {
            overflow-y: auto;
            padding: 32px;
        }

        .detail-panel::-webkit-scrollbar { width: 4px; }
        .detail-panel::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }

        .detail-empty {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100%;
            color: var(--text-muted);
            gap: 12px;
        }

        .detail-empty .empty-icon {
            font-size: 48px;
            opacity: 0.3;
        }

        .detail-empty p {
            font-size: 14px;
        }

        .detail-header {
            margin-bottom: 32px;
            padding-bottom: 24px;
            border-bottom: 1px solid var(--border);
        }

        .detail-title {
            font-size: 22px;
            font-weight: 600;
            letter-spacing: -0.5px;
            margin-bottom: 8px;
        }

        .detail-meta {
            display: flex;
            gap: 20px;
            font-size: 12px;
            color: var(--text-secondary);
        }

        .detail-meta span { display: flex; align-items: center; gap: 4px; }

        /* Turns */
        .turn {
            margin-bottom: 28px;
            border-radius: 14px;
            overflow: hidden;
            border: 1px solid var(--border);
            animation: fadeIn 0.3s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(8px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .turn-header {
            padding: 10px 18px;
            background: rgba(255, 255, 255, 0.03);
            font-size: 11px;
            color: var(--text-muted);
            font-weight: 500;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            border-bottom: 1px solid var(--border);
        }

        .turn-user {
            padding: 18px 20px;
            background: var(--bg-turn-user);
            border-bottom: 1px solid rgba(255, 255, 255, 0.04);
        }

        .turn-label {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 10px;
            font-size: 11px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.8px;
        }

        .turn-label.user-label { color: var(--accent); }
        .turn-label.ai-label { color: var(--green); }

        .turn-content {
            font-size: 14px;
            line-height: 1.7;
            color: var(--text-primary);
            white-space: pre-wrap;
            word-wrap: break-word;
        }

        .turn-ai {
            padding: 18px 20px;
            background: var(--bg-turn-ai);
        }

        .turn-ai .turn-content {
            color: var(--text-secondary);
        }

        .awaiting {
            color: var(--amber);
            font-style: italic;
            font-size: 13px;
        }

        /* Loading */
        .loading {
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 60px;
            color: var(--text-muted);
        }

        .loading-spinner {
            width: 24px;
            height: 24px;
            border: 2px solid var(--border);
            border-top-color: var(--accent);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin-right: 12px;
        }

        @keyframes spin { to { transform: rotate(360deg); } }

        .file-path-badge {
            display: inline-flex;
            align-items: center;
            gap: 4px;
            padding: 4px 10px;
            border-radius: 6px;
            background: rgba(255, 255, 255, 0.04);
            font-size: 11px;
            color: var(--text-muted);
            font-family: 'JetBrains Mono', monospace;
            margin-top: 8px;
            word-break: break-all;
        }

        /* Responsive */
        @media (max-width: 800px) {
            .layout { grid-template-columns: 1fr; }
            .detail-panel { display: none; }
            .detail-panel.mobile-show { display: block; }
            .sidebar.mobile-hide { display: none; }
        }
    </style>
</head>
<body>
    <div class="header">
        <div class="header-left">
            <div class="header-icon">🧵</div>
            <div>
                <div class="header-title">Cruz Brain — Thread Monitor</div>
                <div class="header-subtitle">Real-time conversation thread dashboard</div>
            </div>
        </div>
        <div class="header-stats">
            <div class="live-badge">
                <span class="live-dot"></span>
                Live
            </div>
            <div class="stat-item"><strong id="thread-count">—</strong> threads</div>
            <div class="stat-item">Last refresh: <strong id="last-refresh">—</strong></div>
        </div>
    </div>

    <div class="layout">
        <div class="sidebar" id="sidebar">
            <div class="search-box">
                <span class="search-icon">🔍</span>
                <input type="text" id="search-input" placeholder="Search threads..." />
            </div>
            <div id="thread-list">
                <div class="loading">
                    <div class="loading-spinner"></div>
                    Loading threads...
                </div>
            </div>
        </div>

        <div class="detail-panel" id="detail-panel">
            <div class="detail-empty">
                <div class="empty-icon">🧵</div>
                <p>Select a thread to view the conversation</p>
            </div>
        </div>
    </div>

    <script>
        const API_BASE = window.location.origin;
        let allThreads = [];
        let activeThreadId = null;
        let refreshInterval = null;

        // --- Fetch all threads ---
        async function fetchThreads() {
            try {
                const res = await fetch(`${API_BASE}/api/threads?limit=100`);
                const data = await res.json();
                allThreads = data.threads || [];
                document.getElementById('thread-count').textContent = allThreads.length;
                document.getElementById('last-refresh').textContent = new Date().toLocaleTimeString();
                renderThreadList();
            } catch (err) {
                console.error('Failed to fetch threads:', err);
            }
        }

        // --- Render thread list ---
        function renderThreadList() {
            const searchTerm = (document.getElementById('search-input').value || '').toLowerCase();
            const filtered = allThreads.filter(t =>
                t.title.toLowerCase().includes(searchTerm) ||
                t.user.toLowerCase().includes(searchTerm)
            );

            const container = document.getElementById('thread-list');
            if (filtered.length === 0) {
                container.innerHTML = `
                    <div class="detail-empty" style="padding: 40px 0;">
                        <div class="empty-icon" style="font-size: 32px;">📭</div>
                        <p style="font-size: 13px;">No threads found</p>
                    </div>`;
                return;
            }

            const now = Date.now();
            container.innerHTML = filtered.map(t => {
                const isActive = t.thread_id === activeThreadId;
                const lastUpdated = new Date(t.last_updated + 'Z');
                const isRecent = (now - lastUpdated.getTime()) < 60000; // within 60s
                const dateStr = formatDate(t.created_at);
                const timeAgo = getTimeAgo(lastUpdated);

                return `
                    <div class="thread-card ${isActive ? 'active' : ''}"
                         onclick="selectThread('${t.thread_id}')"
                         id="card-${t.thread_id}">
                        ${isRecent ? '<div class="recent-indicator"></div>' : ''}
                        <div class="thread-card-header">
                            <div class="thread-card-title">${escapeHtml(t.title)}</div>
                        </div>
                        <div class="thread-card-meta">
                            <span class="user-tag">${escapeHtml(t.user)}</span>
                            <span>${dateStr}</span>
                            <span class="turn-count">${t.turn_count} turn${t.turn_count !== 1 ? 's' : ''}</span>
                            <span>${timeAgo}</span>
                        </div>
                    </div>`;
            }).join('');
        }

        // --- Select and load a thread ---
        async function selectThread(threadId) {
            activeThreadId = threadId;
            renderThreadList(); // update active state

            const panel = document.getElementById('detail-panel');
            panel.innerHTML = `<div class="loading"><div class="loading-spinner"></div>Loading thread...</div>`;

            try {
                const res = await fetch(`${API_BASE}/api/threads/${threadId}`);
                const thread = await res.json();
                renderDetail(thread);
            } catch (err) {
                panel.innerHTML = `<div class="detail-empty"><p>Error loading thread</p></div>`;
            }
        }

        // --- Render thread detail ---
        function renderDetail(thread) {
            const panel = document.getElementById('detail-panel');
            const createdStr = formatDateTime(thread.created_at);
            const updatedStr = formatDateTime(thread.last_updated);

            let turnsHtml = '';
            (thread.turns || []).forEach((turn, i) => {
                const timeStr = formatDateTime(turn.created_at);
                const hasResponse = turn.ai_response && turn.ai_response !== '_Awaiting response..._';

                turnsHtml += `
                    <div class="turn">
                        <div class="turn-header">Turn ${turn.turn_number} — ${timeStr}</div>
                        <div class="turn-user">
                            <div class="turn-label user-label">💬 User</div>
                            <div class="turn-content">${escapeHtml(turn.user_prompt)}</div>
                        </div>
                        <div class="turn-ai">
                            <div class="turn-label ai-label">🤖 AI Response</div>
                            ${hasResponse
                                ? `<div class="turn-content">${escapeHtml(turn.ai_response)}</div>`
                                : `<div class="awaiting">⏳ Awaiting response...</div>`
                            }
                        </div>
                    </div>`;
            });

            const filePath = thread.file_path || '';
            const fileBasename = filePath.split(/[/\\]/).pop() || '';

            panel.innerHTML = `
                <div class="detail-header">
                    <div class="detail-title">${escapeHtml(thread.title)}</div>
                    <div class="detail-meta">
                        <span>👤 ${escapeHtml(thread.user)}</span>
                        <span>📅 Created: ${createdStr}</span>
                        <span>🔄 Updated: ${updatedStr}</span>
                        <span>💬 ${thread.turn_count} turn${thread.turn_count !== 1 ? 's' : ''}</span>
                    </div>
                    ${fileBasename ? `<div class="file-path-badge">📄 ${escapeHtml(fileBasename)}</div>` : ''}
                </div>
                ${turnsHtml}`;
        }

        // --- Auto-refresh active thread ---
        async function autoRefresh() {
            await fetchThreads();
            if (activeThreadId) {
                try {
                    const res = await fetch(`${API_BASE}/api/threads/${activeThreadId}`);
                    const thread = await res.json();
                    renderDetail(thread);
                } catch (_) {}
            }
        }

        // --- Helpers ---
        function escapeHtml(str) {
            if (!str) return '';
            const div = document.createElement('div');
            div.textContent = str;
            return div.innerHTML;
        }

        function formatDate(iso) {
            if (!iso) return '';
            try {
                const d = new Date(iso + 'Z');
                return d.toLocaleDateString('en-IN', { month: 'short', day: 'numeric' });
            } catch { return iso.slice(0, 10); }
        }

        function formatDateTime(iso) {
            if (!iso) return '';
            try {
                const d = new Date(iso + 'Z');
                return d.toLocaleString('en-IN', {
                    month: 'short', day: 'numeric',
                    hour: '2-digit', minute: '2-digit', second: '2-digit'
                });
            } catch { return iso; }
        }

        function getTimeAgo(date) {
            const seconds = Math.floor((Date.now() - date.getTime()) / 1000);
            if (seconds < 60) return `${seconds}s ago`;
            const minutes = Math.floor(seconds / 60);
            if (minutes < 60) return `${minutes}m ago`;
            const hours = Math.floor(minutes / 60);
            if (hours < 24) return `${hours}h ago`;
            return `${Math.floor(hours / 24)}d ago`;
        }

        // --- Init ---
        document.getElementById('search-input').addEventListener('input', renderThreadList);
        fetchThreads();
        refreshInterval = setInterval(autoRefresh, 5000);
    </script>
</body>
</html>
