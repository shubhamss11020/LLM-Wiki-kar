<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cruz Brain — Thread Monitor</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        :root {
            --bg-primary: #0a0a0f;
            --bg-secondary: #12121a;
            --bg-card: #1a1a26;
            --bg-card-hover: #22222f;
            --bg-turn-user: #181824;
            --bg-turn-ai: #13131c;
            --border: #2a2a3a;
            --border-active: #6c5ce7;
            --text-primary: #f0f0f8;
            --text-secondary: #a0a0b8;
            --text-muted: #66667e;
            --accent: #6c5ce7;
            --accent-glow: rgba(108, 92, 231, 0.35);
            --green: #00e676;
            --green-glow: rgba(0, 230, 118, 0.25);
            --amber: #ffab40;
            --red: #ff5252;
            --tag-bg: rgba(108, 92, 231, 0.15);
            --code-bg: #0e0e16;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            min-height: 100vh;
            overflow-x: hidden;
        }

        /* Header */
        .header {
            position: sticky;
            top: 0;
            z-index: 100;
            background: rgba(10, 10, 15, 0.9);
            backdrop-filter: blur(20px);
            border-bottom: 1px solid var(--border);
            padding: 16px 32px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .header-left {
            display: flex;
            align-items: center;
            gap: 14px;
        }

        .header-icon {
            width: 38px;
            height: 38px;
            background: linear-gradient(135deg, var(--accent), #a78bfa);
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 19px;
            box-shadow: 0 4px 12px var(--accent-glow);
        }

        .header-title {
            font-size: 18px;
            font-weight: 700;
            letter-spacing: -0.3px;
        }

        .header-subtitle {
            font-size: 12px;
            color: var(--text-secondary);
            margin-top: 2px;
        }

        .header-stats {
            display: flex;
            align-items: center;
            gap: 20px;
        }

        .live-badge {
            display: flex;
            align-items: center;
            gap: 6px;
            padding: 6px 14px;
            border-radius: 20px;
            background: rgba(0, 230, 118, 0.08);
            border: 1px solid rgba(0, 230, 118, 0.2);
            font-size: 12px;
            font-weight: 600;
            color: var(--green);
        }

        .live-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: var(--green);
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0%, 100% { box-shadow: 0 0 0 0 var(--green-glow); }
            50% { box-shadow: 0 0 0 8px transparent; }
        }

        .stat-item {
            font-size: 13px;
            color: var(--text-secondary);
        }

        .stat-item strong {
            color: var(--text-primary);
            font-weight: 600;
        }

        /* Layout */
        .layout {
            display: grid;
            grid-template-columns: 380px 1fr;
            height: calc(100vh - 71px);
        }

        /* Thread List Sidebar */
        .sidebar {
            border-right: 1px solid var(--border);
            overflow-y: auto;
            padding: 16px;
            background: rgba(14, 14, 20, 0.5);
        }

        .sidebar::-webkit-scrollbar { width: 5px; }
        .sidebar::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }

        .search-box {
            position: relative;
            margin-bottom: 16px;
        }

        .search-box input {
            width: 100%;
            padding: 10px 14px 10px 38px;
            border-radius: 10px;
            border: 1px solid var(--border);
            background: var(--bg-secondary);
            color: var(--text-primary);
            font-size: 13px;
            font-family: inherit;
            outline: none;
            transition: all 0.2s;
        }

        .search-box input:focus {
            border-color: var(--accent);
            box-shadow: 0 0 0 2px var(--accent-glow);
        }

        .search-box .search-icon {
            position: absolute;
            left: 12px;
            top: 50%;
            transform: translateY(-50%);
            font-size: 14px;
            color: var(--text-muted);
        }

        .thread-card {
            padding: 14px 16px;
            border-radius: 12px;
            border: 1px solid transparent;
            cursor: pointer;
            transition: all 0.2s ease;
            margin-bottom: 6px;
            position: relative;
            background: rgba(22, 22, 32, 0.4);
        }

        .thread-card:hover {
            background: var(--bg-card);
            border-color: var(--border);
            transform: translateY(-1px);
        }

        .thread-card.active {
            background: var(--bg-card);
            border-color: var(--border-active);
            box-shadow: 0 0 0 1px var(--accent-glow);
        }

        .thread-card-header {
            display: flex;
            align-items: flex-start;
            justify-content: space-between;
            gap: 8px;
        }

        .thread-card-title {
            font-size: 14px;
            font-weight: 600;
            line-height: 1.35;
            color: var(--text-primary);
        }

        .thread-card-meta {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-top: 8px;
            font-size: 11px;
            color: var(--text-secondary);
        }

        .thread-card-meta .user-tag {
            padding: 2px 8px;
            border-radius: 6px;
            background: var(--tag-bg);
            color: #b4a7d6;
            font-weight: 600;
        }

        .turn-count {
            padding: 2px 8px;
            border-radius: 6px;
            background: rgba(255, 255, 255, 0.06);
            font-weight: 500;
        }

        .recent-indicator {
            position: absolute;
            top: 14px;
            right: 14px;
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: var(--green);
            animation: pulse 2s infinite;
        }

        /* Detail Panel */
        .detail-panel {
            overflow-y: auto;
            padding: 32px 40px;
            background: var(--bg-primary);
        }

        .detail-panel::-webkit-scrollbar { width: 5px; }
        .detail-panel::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }

        .detail-empty {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100%;
            color: var(--text-muted);
            gap: 14px;
        }

        .detail-empty .empty-icon {
            font-size: 52px;
            opacity: 0.3;
        }

        .detail-empty p {
            font-size: 15px;
        }

        .detail-header {
            margin-bottom: 32px;
            padding-bottom: 24px;
            border-bottom: 1px solid var(--border);
        }

        .detail-title {
            font-size: 22px;
            font-weight: 700;
            letter-spacing: -0.4px;
            margin-bottom: 12px;
            color: var(--text-primary);
            line-height: 1.35;
        }

        .detail-meta {
            display: flex;
            flex-wrap: wrap;
            gap: 16px;
            font-size: 12px;
            color: var(--text-secondary);
        }

        .detail-meta span { display: flex; align-items: center; gap: 5px; }

        /* Turns */
        .turn {
            margin-bottom: 30px;
            border-radius: 14px;
            overflow: hidden;
            border: 1px solid var(--border);
            animation: fadeIn 0.3s ease;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.2);
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(8px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .turn-header {
            padding: 10px 20px;
            background: rgba(255, 255, 255, 0.03);
            font-size: 12px;
            color: var(--text-muted);
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.6px;
            border-bottom: 1px solid var(--border);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .turn-user {
            padding: 20px 22px;
            background: var(--bg-turn-user);
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
            position: relative;
        }

        .turn-label-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 12px;
        }

        .turn-label {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 12px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.8px;
        }

        .turn-label.user-label { color: #a78bfa; }
        .turn-label.ai-label { color: var(--green); }

        .copy-btn {
            background: rgba(255, 255, 255, 0.06);
            border: 1px solid var(--border);
            color: var(--text-secondary);
            padding: 4px 10px;
            border-radius: 6px;
            font-size: 11px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s;
            display: inline-flex;
            align-items: center;
            gap: 4px;
        }

        .copy-btn:hover {
            background: rgba(255, 255, 255, 0.12);
            color: var(--text-primary);
        }

        .turn-content {
            font-size: 14.5px;
            line-height: 1.75;
            color: var(--text-primary);
            word-wrap: break-word;
        }

        .turn-content p {
            margin-bottom: 12px;
        }

        .turn-content p:last-child {
            margin-bottom: 0;
        }

        .turn-content ul, .turn-content ol {
            margin: 10px 0 14px 22px;
        }

        .turn-content li {
            margin-bottom: 6px;
        }

        .turn-content strong {
            color: #ffffff;
            font-weight: 600;
        }

        .turn-content h1, .turn-content h2, .turn-content h3, .turn-content h4 {
            color: #ffffff;
            margin: 16px 0 8px 0;
            font-weight: 600;
        }

        .turn-content code {
            font-family: 'JetBrains Mono', monospace;
            background: var(--code-bg);
            padding: 2px 6px;
            border-radius: 4px;
            font-size: 13px;
            color: #e2b714;
            border: 1px solid rgba(255, 255, 255, 0.06);
        }

        .turn-content pre {
            background: var(--code-bg);
            padding: 14px;
            border-radius: 8px;
            overflow-x: auto;
            margin: 12px 0;
            border: 1px solid var(--border);
        }

        .turn-content pre code {
            padding: 0;
            background: transparent;
            border: none;
            color: #e8e8f0;
        }

        .turn-content .wikilink {
            display: inline-flex;
            align-items: center;
            padding: 2px 8px;
            border-radius: 6px;
            background: rgba(108, 92, 231, 0.18);
            color: #c4b5fd;
            border: 1px solid rgba(108, 92, 231, 0.3);
            font-weight: 500;
            font-size: 13px;
        }

        .turn-ai {
            padding: 20px 22px;
            background: var(--bg-turn-ai);
            position: relative;
        }

        .awaiting {
            color: var(--amber);
            font-style: italic;
            font-size: 13.5px;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        /* Loading */
        .loading {
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 60px;
            color: var(--text-muted);
        }

        .loading-spinner {
            width: 24px;
            height: 24px;
            border: 2px solid var(--border);
            border-top-color: var(--accent);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin-right: 12px;
        }

        @keyframes spin { to { transform: rotate(360deg); } }

        .file-path-badge {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 5px 12px;
            border-radius: 6px;
            background: rgba(255, 255, 255, 0.05);
            font-size: 11.5px;
            color: var(--text-secondary);
            font-family: 'JetBrains Mono', monospace;
            margin-top: 10px;
            word-break: break-all;
            border: 1px solid var(--border);
        }

        .toast {
            position: fixed;
            bottom: 24px;
            right: 24px;
            background: #1e1e2e;
            color: #fff;
            padding: 10px 18px;
            border-radius: 8px;
            border: 1px solid var(--border-active);
            font-size: 13px;
            font-weight: 500;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.4);
            opacity: 0;
            transform: translateY(10px);
            transition: all 0.3s ease;
            z-index: 999;
            pointer-events: none;
        }

        .toast.show {
            opacity: 1;
            transform: translateY(0);
        }

        /* Responsive */
        @media (max-width: 800px) {
            .layout { grid-template-columns: 1fr; }
            .detail-panel { display: none; }
            .detail-panel.mobile-show { display: block; }
            .sidebar.mobile-hide { display: none; }
        }
    </style>
</head>
<body>
    <div class="header">
        <div class="header-left">
            <div class="header-icon">🧵</div>
            <div>
                <div class="header-title">Cruz Brain — Thread Monitor</div>
                <div class="header-subtitle">Real-time conversation thread dashboard</div>
            </div>
        </div>
        <div class="header-stats">
            <div class="live-badge">
                <span class="live-dot"></span>
                Live
            </div>
            <div class="stat-item"><strong id="thread-count">—</strong> threads</div>
            <div class="stat-item">Last refresh: <strong id="last-refresh">—</strong></div>
        </div>
    </div>

    <div class="layout">
        <div class="sidebar" id="sidebar">
            <div class="search-box">
                <span class="search-icon">🔍</span>
                <input type="text" id="search-input" placeholder="Search threads..." />
            </div>
            <div id="thread-list">
                <div class="loading">
                    <div class="loading-spinner"></div>
                    Loading threads...
                </div>
            </div>
        </div>

        <div class="detail-panel" id="detail-panel">
            <div class="detail-empty">
                <div class="empty-icon">🧵</div>
                <p>Select a thread to view the conversation</p>
            </div>
        </div>
    </div>

    <div id="toast" class="toast">Copied to clipboard!</div>

    <script>
        const API_BASE = window.location.origin;
        let allThreads = [];
        let activeThreadId = null;
        let refreshInterval = null;

        // --- Robust ISO Date Parser ---
        function parseIsoDate(iso) {
            if (!iso) return null;
            if (iso instanceof Date) return isNaN(iso.getTime()) ? null : iso;
            const str = String(iso).trim();
            if (!str) return null;

            // If string already has explicit offset (+05:30, -04:00, +0530) or 'Z'
            if (str.endsWith('Z') || /[+-]\d{2}:?\d{2}$/.test(str)) {
                const d = new Date(str);
                if (!isNaN(d.getTime())) return d;
            }

            // Standard ISO with T
            const clean = str.replace(' ', 'T');
            const d1 = new Date(clean);
            if (!isNaN(d1.getTime())) return d1;

            // Fallback assuming UTC
            const d2 = new Date(clean + 'Z');
            if (!isNaN(d2.getTime())) return d2;

            return null;
        }

        function formatDate(iso) {
            const d = parseIsoDate(iso);
            if (!d) return iso ? String(iso).slice(0, 10) : '';
            return d.toLocaleDateString('en-IN', { month: 'short', day: 'numeric' });
        }

        function formatDateTime(iso) {
            const d = parseIsoDate(iso);
            if (!d) return iso || '';
            return d.toLocaleString('en-IN', {
                month: 'short', day: 'numeric', year: 'numeric',
                hour: '2-digit', minute: '2-digit', second: '2-digit',
                hour12: true
            });
        }

        function formatTurnHeaderTime(iso) {
            const d = parseIsoDate(iso);
            if (!d) return iso ? String(iso).slice(0, 19).replace('T', ' ') : '';
            return d.toLocaleString('en-IN', {
                month: 'short', day: 'numeric',
                hour: '2-digit', minute: '2-digit', second: '2-digit',
                hour12: true
            }).toUpperCase();
        }

        function getTimeAgo(dateInput) {
            const date = parseIsoDate(dateInput);
            if (!date) return '';
            const seconds = Math.max(0, Math.floor((Date.now() - date.getTime()) / 1000));
            if (seconds < 60) return `${seconds}s ago`;
            const minutes = Math.floor(seconds / 60);
            if (minutes < 60) return `${minutes}m ago`;
            const hours = Math.floor(minutes / 60);
            if (hours < 24) return `${hours}h ago`;
            return `${Math.floor(hours / 24)}d ago`;
        }

        // --- Safe Rich Markdown Formatter ---
        function renderMarkdown(text) {
            if (!text) return '';
            
            // Format Obsidian wikilinks [[Note Name]]
            let processed = text.replace(/\[\[(.*?)\]\]/g, (match, note) => {
                return `<span class="wikilink">📄 ${escapeHtml(note)}</span>`;
            });

            if (window.marked && typeof window.marked.parse === 'function') {
                try {
                    return window.marked.parse(processed, { breaks: true, gfm: true });
                } catch (e) {
                    console.warn('Marked.js parsing error, using fallback:', e);
                }
            }

            // Fallback Formatter
            return escapeHtml(processed)
                .replace(/\n\n+/g, '</p><p>')
                .replace(/\n/g, '<br/>')
                .replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>')
                .replace(/\*(.*?)\*/g, '<em>$1</em>');
        }

        function escapeHtml(str) {
            if (!str) return '';
            const div = document.createElement('div');
            div.textContent = str;
            return div.innerHTML;
        }

        function showToast(msg = 'Copied to clipboard!') {
            const toast = document.getElementById('toast');
            toast.textContent = msg;
            toast.classList.add('show');
            setTimeout(() => toast.classList.remove('show'), 2000);
        }

        function copyTurnText(elementId) {
            const el = document.getElementById(elementId);
            if (!el) return;
            const rawText = el.getAttribute('data-raw') || el.innerText;
            navigator.clipboard.writeText(rawText).then(() => {
                showToast('Copied to clipboard!');
            }).catch(err => {
                console.error('Clipboard copy failed:', err);
            });
        }

        // --- Fetch all threads ---
        async function fetchThreads() {
            try {
                const res = await fetch(`${API_BASE}/api/threads?limit=100`);
                const data = await res.json();
                allThreads = data.threads || [];
                document.getElementById('thread-count').textContent = allThreads.length;
                document.getElementById('last-refresh').textContent = new Date().toLocaleTimeString('en-IN', { hour12: true });
                renderThreadList();
            } catch (err) {
                console.error('Failed to fetch threads:', err);
            }
        }

        // --- Render thread list ---
        function renderThreadList() {
            const searchTerm = (document.getElementById('search-input').value || '').toLowerCase();
            const filtered = allThreads.filter(t =>
                (t.title || '').toLowerCase().includes(searchTerm) ||
                (t.user || '').toLowerCase().includes(searchTerm)
            );

            const container = document.getElementById('thread-list');
            if (filtered.length === 0) {
                container.innerHTML = `
                    <div class="detail-empty" style="padding: 40px 0;">
                        <div class="empty-icon" style="font-size: 32px;">📭</div>
                        <p style="font-size: 13px;">No threads found</p>
                    </div>`;
                return;
            }

            const now = Date.now();
            container.innerHTML = filtered.map(t => {
                const isActive = t.thread_id === activeThreadId;
                const lastUpdatedDate = parseIsoDate(t.last_updated);
                const isRecent = lastUpdatedDate && (now - lastUpdatedDate.getTime()) < 60000;
                const dateStr = formatDate(t.created_at);
                const timeAgo = getTimeAgo(t.last_updated);

                return `
                    <div class="thread-card ${isActive ? 'active' : ''}"
                         onclick="selectThread('${t.thread_id}')"
                         id="card-${t.thread_id}">
                        ${isRecent ? '<div class="recent-indicator"></div>' : ''}
                        <div class="thread-card-header">
                            <div class="thread-card-title">${escapeHtml(t.title)}</div>
                        </div>
                        <div class="thread-card-meta">
                            <span class="user-tag">${escapeHtml(t.user)}</span>
                            <span>${dateStr}</span>
                            <span class="turn-count">${t.turn_count} turn${t.turn_count !== 1 ? 's' : ''}</span>
                            <span>${timeAgo}</span>
                        </div>
                    </div>`;
            }).join('');
        }

        // --- Select and load a thread ---
        async function selectThread(threadId) {
            activeThreadId = threadId;
            renderThreadList(); // update active card highlight

            const panel = document.getElementById('detail-panel');
            panel.innerHTML = `<div class="loading"><div class="loading-spinner"></div>Loading thread...</div>`;

            try {
                const res = await fetch(`${API_BASE}/api/threads/${threadId}`);
                const thread = await res.json();
                renderDetail(thread);
            } catch (err) {
                panel.innerHTML = `<div class="detail-empty"><p>Error loading thread</p></div>`;
            }
        }

        // --- Render thread detail ---
        function renderDetail(thread) {
            const panel = document.getElementById('detail-panel');
            const createdStr = formatDateTime(thread.created_at);
            const updatedStr = formatDateTime(thread.last_updated);

            let turnsHtml = '';
            (thread.turns || []).forEach((turn, i) => {
                const timeStr = formatTurnHeaderTime(turn.created_at);
                const hasResponse = turn.ai_response && turn.ai_response !== '_Awaiting response..._';
                const userContentId = `turn-user-content-${turn.turn_number}`;
                const aiContentId = `turn-ai-content-${turn.turn_number}`;

                turnsHtml += `
                    <div class="turn">
                        <div class="turn-header">
                            <span>Turn ${turn.turn_number} — ${timeStr}</span>
                        </div>
                        <div class="turn-user">
                            <div class="turn-label-row">
                                <div class="turn-label user-label">💬 User</div>
                                <button class="copy-btn" onclick="copyTurnText('${userContentId}')">📋 Copy</button>
                            </div>
                            <div class="turn-content" id="${userContentId}" data-raw="${escapeHtml(turn.user_prompt)}">${renderMarkdown(turn.user_prompt)}</div>
                        </div>
                        <div class="turn-ai">
                            <div class="turn-label-row">
                                <div class="turn-label ai-label">🤖 AI Response</div>
                                ${hasResponse ? `<button class="copy-btn" onclick="copyTurnText('${aiContentId}')">📋 Copy</button>` : ''}
                            </div>
                            ${hasResponse
                                ? `<div class="turn-content" id="${aiContentId}" data-raw="${escapeHtml(turn.ai_response)}">${renderMarkdown(turn.ai_response)}</div>`
                                : `<div class="awaiting">⏳ Awaiting response...</div>`
                            }
                        </div>
                    </div>`;
            });

            const filePath = thread.file_path || '';
            const fileBasename = filePath.split(/[/\\]/).pop() || '';

            panel.innerHTML = `
                <div class="detail-header">
                    <div class="detail-title">${escapeHtml(thread.title)}</div>
                    <div class="detail-meta">
                        <span>👤 ${escapeHtml(thread.user)}</span>
                        <span>📅 Created: ${createdStr}</span>
                        <span>🔄 Updated: ${updatedStr}</span>
                        <span>💬 ${thread.turn_count} turn${thread.turn_count !== 1 ? 's' : ''}</span>
                    </div>
                    ${fileBasename ? `<div class="file-path-badge">📄 ${escapeHtml(fileBasename)}</div>` : ''}
                </div>
                ${turnsHtml}`;
        }

        // --- Auto-refresh active thread ---
        async function autoRefresh() {
            await fetchThreads();
            if (activeThreadId) {
                try {
                    const res = await fetch(`${API_BASE}/api/threads/${activeThreadId}`);
                    const thread = await res.json();
                    renderDetail(thread);
                } catch (_) {}
            }
        }

        // --- Init ---
        document.getElementById('search-input').addEventListener('input', renderThreadList);
        fetchThreads();
        refreshInterval = setInterval(autoRefresh, 5000);
    </script>
</body>
</html>
